<!DOCTYPE html>                    <!-- INI ASLINYA WELCOME YA! -->
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Welcome | Najwa's Portfolio</title>

    <link rel="stylesheet" href="welcome.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
        rel="stylesheet"
    >
</head>

<body>

    <main class="welcome-page">

        <!-- Dekorasi -->
        <div class="decor decor-one">✿</div>
        <div class="decor decor-two">✦</div>
        <div class="decor decor-three">♡</div>
        <div class="decor decor-four">☁</div>


        <!-- Welcome Card -->
        <section class="welcome-card">

            <div class="flower-icon">
                🌷
            </div>

            <p class="mini-title">
                WELCOME TO MY
            </p>

            <h1>
                Portfolio Profile
            </h1>

            <p class="name">
                I'm Najwa Anjelina 
            </p>

            <p class="description">
                A little space where I share my journey,
                skills, creations, and things I'm learning.
            </p>

            <button id="exploreButton">
                Explore My Portfolio
                <span>→</span>
            </button>

            <p class="bottom-text">
                made with ♡ & pastel colors
            </p>

        </section>

    </main>

    <!-- LOADING SAAT MASUK PORTFOLIO -->
    <div class="loading-screen" id="loadingScreen">

        <div class="loading-content">

            <div class="loading-flower">
                ✿
            </div>

            <h2>Just a moment . . .</h2>

            <p>Preparing your little space :D</p>

            <div class="loading-bar">
                <div id="loadingProgress"></div>
            </div>

        </div>

    </div>

<script src="welcome.js"></script>

</body>
</html>
